name: support-backend

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-support_system}
      MYSQL_USER: ${DB_APP_USER:-support_app}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:-support_app_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - support_net
    # Hanya untuk development. Di production, MySQL bisa tidak expose port
    ports:
      - "127.0.0.1:3306:3306"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-change_me_super_secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,https://skripsi.syukurapi.online}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_APP_USER:-support_app}
      DB_PASSWORD: ${DB_APP_PASSWORD:-support_app_pass}
      DB_NAME: ${DB_NAME:-support_system}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - support_net

volumes:
  mysql_data:

networks:
  support_net:
    driver: bridge
